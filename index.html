<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rive Animation App</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        padding: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      canvas {
        width: 2400px;
        height: 2400px;
        max-width: 90vw;
        max-height: 90vh;
        object-fit: contain;
      }

      /* Overlay styles */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }

      .overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .overlay-content {
        background: white;
        border-radius: 12px;
        max-width: 500px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        transform: translateY(20px);
        transition: transform 0.3s ease;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      }

      .overlay.show .overlay-content {
        transform: translateY(0);
      }

      .overlay-header {
        padding: 1.5rem 2rem 1rem 2rem;
        border-bottom: 1px solid #eee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .overlay-header h2 {
        margin: 0;
        color: #333;
        font-size: 1.5rem;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: #666;
        padding: 0.25rem;
        border-radius: 4px;
        transition: background-color 0.2s ease;
      }

      .close-btn:hover {
        background: #f0f0f0;
        color: #333;
      }

      .overlay-body {
        padding: 1.5rem 2rem;
      }

      .overlay-body p {
        margin: 0;
        line-height: 1.6;
        color: #555;
      }

      .overlay-footer {
        padding: 1rem 2rem 1.5rem 2rem;
        border-top: 1px solid #eee;
        display: flex;
        justify-content: flex-end;
      }

      .action-btn {
        background: #007bff;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.2s ease;
      }

      .action-btn:hover {
        background: #0056b3;
      }

      /* Responsive overlay */
      @media (max-width: 768px) {
        .overlay-content {
          width: 95%;
          margin: 1rem;
        }

        .overlay-header {
          padding: 1rem 1.5rem 0.75rem 1.5rem;
        }

        .overlay-header h2 {
          font-size: 1.25rem;
        }

        .overlay-body {
          padding: 1rem 1.5rem;
        }

        .overlay-footer {
          padding: 0.75rem 1.5rem 1rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <canvas id="rive-canvas"></canvas>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
